<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kyte</title>
        <style>
            html,
            body,
            #root {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            body {
                overflow: hidden;
            }

            #startup {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-items: center;
                background: #1d1e20;
                opacity: 1;
                transition: opacity 180ms ease-out;
            }

            #startup.startup-hidden {
                opacity: 0;
                pointer-events: none;
            }

            #startup img {
                width: 112px;
                height: 112px;
                object-fit: contain;
            }
        </style>
    </head>

    <body>
        <div id="modal-root"></div>
        <div id="root"></div>
        <div id="startup">
            <img src="/kyte.svg" alt="Kyte" />
        </div>
        <script type="module">
            import { getCurrentWindow } from "@tauri-apps/api/window";

            const logo = document.querySelector("#startup img");

            async function start() {
                if (logo instanceof HTMLImageElement) {
                    await logo.decode().catch(() => undefined);
                }

                await getCurrentWindow().show();
                await new Promise((resolve) => requestAnimationFrame(resolve));
                await import("/src/main.tsx");
            }

            start();
        </script>
    </body>
</html>
